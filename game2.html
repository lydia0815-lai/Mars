<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>雲端對決 - 猜拳連線遊戲</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        /* 藍色天空漸層背景與雲朵動畫 */
        .sky-bg {
            background: linear-gradient(180deg, #3a88e9 0%, #5ea4ff 35%, #8ec5fc 70%, #e0c3fc 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* 飄動雲朵 */
        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.45);
            border-radius: 100px;
            filter: blur(3px);
            animation: floatClouds linear infinite;
            pointer-events: none;
        }

        .cloud::before, .cloud::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.45);
            border-radius: 50%;
        }

        .cloud1 { width: 140px; height: 50px; top: 8%; animation-duration: 35s; }
        .cloud1::before { width: 60px; height: 60px; top: -25px; left: 20px; }
        .cloud1::after { width: 45px; height: 45px; top: -15px; right: 20px; }

        .cloud2 { width: 220px; height: 70px; top: 25%; animation-duration: 48s; animation-delay: -15s; }
        .cloud2::before { width: 90px; height: 90px; top: -40px; left: 35px; }
        .cloud2::after { width: 70px; height: 70px; top: -25px; right: 35px; }

        .cloud3 { width: 180px; height: 60px; top: 60%; animation-duration: 40s; animation-delay: -7s; }
        .cloud3::before { width: 75px; height: 75px; top: -30px; left: 25px; }
        .cloud3::after { width: 55px; height: 55px; top: -20px; right: 25px; }

        @keyframes floatClouds {
            0% { transform: translateX(-250px); }
            100% { transform: translateX(105vw); }
        }

        /* 玻璃擬物風格卡片 */
        .glass-card {
            background: rgba(255, 255, 255, 0.68);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.85);
            box-shadow: 0 10px 30px rgba(0, 102, 204, 0.12);
        }

        .glass-card-subtle {
            background: rgba(255, 255, 255, 0.48);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.65);
        }

        /* 遊戲出拳按鈕特效 */
        .hand-btn {
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 8px 20px rgba(0, 80, 180, 0.15);
        }
        .hand-btn:active {
            transform: scale(0.92);
        }
        .hand-btn.selected {
            background: #2563eb !important;
            color: white !important;
            border-color: #60a5fa !important;
            transform: translateY(-6px) scale(1.05);
            box-shadow: 0 12px 25px rgba(37, 99, 235, 0.4);
        }

        /* 微浮動動畫 */
        @keyframes gentleFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }
        .animate-float {
            animation: gentleFloat 4s ease-in-out infinite;
        }

        /* 閃爍脈衝 */
        @keyframes pulseGlow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.85; transform: scale(1.02); }
        }
        .animate-pulse-glow {
            animation: pulseGlow 2s ease-in-out infinite;
        }

        /* 隱藏滾動條 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="sky-bg text-slate-800 flex flex-col justify-between min-h-screen selection:bg-blue-200">

    <!-- 背景雲朵 -->
    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
    <div class="cloud cloud3"></div>

    <!-- 頂部標題區 -->
    <header class="w-full pt-6 pb-2 px-4 text-center z-10">
        <div class="inline-flex items-center gap-2 bg-white/40 backdrop-blur-md px-4 py-1.5 rounded-full border border-white/60 shadow-sm mb-2">
            <span class="w-2.5 h-2.5 rounded-full bg-sky-400 animate-ping"></span>
            <span id="status-tag" class="text-xs font-bold text-sky-900 tracking-wider uppercase">即時天空對決</span>
        </div>
        <h1 class="text-3xl sm:text-4xl font-extrabold text-white drop-shadow-md tracking-tight flex items-center justify-center gap-3">
            <i class="fa-solid font-normal fa-cloud-sun text-yellow-300"></i>
            雲端猜拳
        </h1>
    </header>

    <!-- 主要內容區域 -->
    <main class="flex-1 w-full max-w-md mx-auto px-4 py-2 flex flex-col justify-center items-center z-10">

        <!-- 畫面 1：大廳 / 建房 / 入房 -->
        <div id="view-lobby" class="w-full glass-card rounded-3xl p-6 sm:p-8 flex flex-col gap-6 animate-float">
            
            <div class="text-center">
                <div class="text-5xl mb-2">🌤️</div>
                <h2 class="text-xl font-bold text-sky-900">準備進入天空對戰</h2>
                <p class="text-xs text-sky-700/80 mt-1">創建或輸入 4 位數房號開始遊戲 (支援 2~3 人)</p>
            </div>

            <!-- 輸入玩家暱稱 -->
            <div class="space-y-1">
                <label class="text-xs font-semibold text-sky-900/80 ml-1">您的暱稱</label>
                <div class="relative">
                    <i class="fa-solid fa-user absolute left-4 top-1/2 -translate-y-1/2 text-sky-400"></i>
                    <input type="text" id="player-name-input" maxlength="8" placeholder="玩家暱稱..." 
                        class="w-full pl-11 pr-4 py-3.5 bg-white/80 rounded-2xl border border-sky-200 focus:outline-none focus:ring-2 focus:ring-sky-400 text-sky-900 font-semibold shadow-inner placeholder:text-sky-300 text-base">
                </div>
            </div>

            <hr class="border-sky-200/60 my-1">

            <!-- 建立房間區域 -->
            <div class="flex flex-col gap-3">
                <button id="btn-create-room" class="w-full py-4 bg-gradient-to-r from-sky-400 to-blue-500 hover:from-sky-500 hover:to-blue-600 text-white font-extrabold text-lg rounded-2xl shadow-lg active:scale-95 transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-plus-circle"></i>
                    創建新房間 (4位數)
                </button>
            </div>

            <!-- 或輸入房號加入 -->
            <div class="flex flex-col gap-3">
                <div class="flex items-center gap-2">
                    <div class="h-px bg-sky-200/80 flex-1"></div>
                    <span class="text-xs text-sky-600/70 font-semibold">或者加入房間</span>
                    <div class="h-px bg-sky-200/80 flex-1"></div>
                </div>

                <div class="flex gap-2">
                    <input type="number" id="room-code-input" pattern="[0-9]*" inputmode="numeric" maxlength="4" placeholder="4 位數字" 
                        class="w-1/2 text-center py-3.5 bg-white/80 rounded-2xl border border-sky-200 focus:outline-none focus:ring-2 focus:ring-sky-400 text-sky-900 font-bold text-xl tracking-widest placeholder:text-sky-300 placeholder:text-sm shadow-inner">
                    <button id="btn-join-room" class="w-1/2 py-3.5 bg-sky-100 hover:bg-sky-200 text-sky-700 font-bold text-base rounded-2xl border border-sky-300 shadow-sm active:scale-95 transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-right-to-bracket"></i>
                        加入房間
                    </button>
                </div>
            </div>

            <div id="lobby-error" class="text-red-500 text-xs font-semibold text-center hidden"></div>
        </div>

        <!-- 畫面 2：遊戲房間畫面 -->
        <div id="view-room" class="w-full flex flex-col gap-4 hidden">

            <!-- 房號頂部資訊列 -->
            <div class="glass-card rounded-2xl px-5 py-3 flex items-center justify-between shadow-md">
                <div class="flex items-center gap-2">
                    <span class="text-xs text-sky-700 font-semibold">房號：</span>
                    <span id="display-room-code" class="text-2xl font-black text-sky-900 tracking-wider">----</span>
                    <button id="btn-copy-room" class="text-sky-500 hover:text-sky-700 p-1 text-sm active:scale-90 transition" title="複製房號">
                        <i class="fa-regular fa-copy"></i>
                    </button>
                </div>
                <div class="flex items-center gap-2">
                    <span id="room-player-count" class="text-xs font-bold text-sky-800 bg-sky-200/70 px-2.5 py-1 rounded-full">
                        👥 0/3
                    </span>
                    <button id="btn-leave-room" class="bg-red-100 hover:bg-red-200 text-red-600 px-3 py-1 rounded-full text-xs font-bold transition active:scale-95">
                        離開
                    </button>
                </div>
            </div>

            <!-- 玩家狀態面板 -->
            <div class="glass-card rounded-3xl p-4 sm:p-5 shadow-lg">
                <div class="text-xs font-bold text-sky-800/70 mb-3 text-center uppercase tracking-wider flex items-center justify-center gap-1">
                    <i class="fa-solid fa-users text-sky-500"></i> 在線成員狀態
                </div>
                <div id="players-container" class="grid grid-cols-2 sm:grid-cols-3 gap-2">
                    <!-- 動態生成玩家卡片 -->
                </div>
            </div>

            <!-- 局勢提示區 -->
            <div id="round-status-banner" class="glass-card-subtle rounded-2xl p-3.5 text-center font-bold text-sky-900 shadow-sm animate-pulse-glow flex items-center justify-center gap-2 text-sm sm:text-base">
                <i class="fa-solid fa-spinner fa-spin text-sky-500"></i>
                <span>等待其他玩家加入...</span>
            </div>

            <!-- 出拳選擇區 -->
            <div class="glass-card rounded-3xl p-5 shadow-lg flex flex-col items-center gap-4">
                <div class="text-xs font-bold text-sky-800/70 uppercase tracking-wider">選擇您的出拳</div>
                
                <div class="grid grid-cols-3 gap-3 w-full">
                    <button data-choice="rock" class="hand-btn bg-white/90 border-2 border-sky-100 rounded-2xl py-4 flex flex-col items-center justify-center gap-1 active:scale-95">
                        <span class="text-4xl sm:text-5xl">✊</span>
                        <span class="text-xs font-extrabold text-sky-800">石頭</span>
                    </button>
                    
                    <button data-choice="scissors" class="hand-btn bg-white/90 border-2 border-sky-100 rounded-2xl py-4 flex flex-col items-center justify-center gap-1 active:scale-95">
                        <span class="text-4xl sm:text-5xl">✌️</span>
                        <span class="text-xs font-extrabold text-sky-800">剪刀</span>
                    </button>
                    
                    <button data-choice="paper" class="hand-btn bg-white/90 border-2 border-sky-100 rounded-2xl py-4 flex flex-col items-center justify-center gap-1 active:scale-95">
                        <span class="text-4xl sm:text-5xl">✋</span>
                        <span class="text-xs font-extrabold text-sky-800">布</span>
                    </button>
                </div>
            </div>

            <!-- 控制按鈕（下一局 / 重置） -->
            <div id="round-controls" class="hidden flex gap-2 w-full">
                <button id="btn-next-round" class="w-full py-4 bg-gradient-to-r from-emerald-400 to-teal-500 hover:from-emerald-500 hover:to-teal-600 text-white font-extrabold text-base rounded-2xl shadow-lg active:scale-95 transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-rotate-right"></i>
                    開始下一局
                </button>
            </div>

            <!-- 歷史戰績對戰紀錄 -->
            <div class="glass-card-subtle rounded-2xl p-4 shadow-sm flex flex-col gap-2 max-h-36 overflow-y-auto no-scrollbar">
                <div class="text-xs font-bold text-sky-800/80 flex items-center justify-between">
                    <span><i class="fa-solid fa-clock-rotate-left mr-1"></i>回合戰績歷史</span>
                    <span id="total-rounds-count" class="text-[10px] bg-white/60 px-2 py-0.5 rounded-full">第 1 局</span>
                </div>
                <div id="history-list" class="space-y-1.5 text-xs text-sky-900">
                    <div class="text-center text-sky-500/70 py-2 italic text-xs">暫無紀錄，等待第一局出拳...</div>
                </div>
            </div>

        </div>

    </main>

    <!-- 頁尾 -->
    <footer class="w-full py-3 text-center text-xs text-white/80 font-medium z-10">
        <p>天空雲端連線對戰 ☁️ 支援 2 ~ 3 人</p>
    </footer>

    <!-- 自訂訊息提示 Modal -->
    <div id="custom-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="glass-card rounded-3xl p-6 max-w-xs w-full text-center flex flex-col items-center gap-4 animate-float shadow-2xl">
            <div id="modal-icon" class="text-4xl">🌤️</div>
            <p id="modal-message" class="text-sm font-bold text-sky-900 leading-relaxed">提示訊息</p>
            <button id="modal-btn-close" class="w-full py-2.5 bg-sky-500 hover:bg-sky-600 text-white font-bold rounded-xl shadow transition active:scale-95">
                確定
            </button>
        </div>
    </div>

    <!-- 引入 Firebase Compat SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <script>
        // === 您的 Firebase 配置 (Firebase Config) ===
        const firebaseConfig = {
            apiKey: "AIzaSyD_XwMWXpUg3OJZBLx0e1A2LKNFl3mpnn8",
            authDomain: "project-9055340413398078399.firebaseapp.com",
            databaseURL: "https://project-9055340413398078399-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "project-9055340413398078399",
            storageBucket: "project-9055340413398078399.firebasestorage.app",
            messagingSenderId: "984429802835",
            appId: "1:984429802835:web:038d4191feb28d93259da6",
            measurementId: "G-Z5D344VKHP"
        };

        // 初始化 Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 全局狀態
        let myPlayerId = 'p_' + Math.random().toString(36).substring(2, 9);
        let currentRoomCode = null;
        let myChoice = null;
        let myName = '玩家 ' + Math.floor(Math.random() * 899 + 100);
        let roomRef = null;
        let roomDataCache = null;

        // UI 元素
        const viewLobby = document.getElementById('view-lobby');
        const viewRoom = document.getElementById('view-room');
        const playerNameInput = document.getElementById('player-name-input');
        const roomCodeInput = document.getElementById('room-code-input');
        const btnCreateRoom = document.getElementById('btn-create-room');
        const btnJoinRoom = document.getElementById('btn-join-room');
        const lobbyError = document.getElementById('lobby-error');
        const displayRoomCode = document.getElementById('display-room-code');
        const roomPlayerCount = document.getElementById('room-player-count');
        const playersContainer = document.getElementById('players-container');
        const roundStatusBanner = document.getElementById('round-status-banner');
        const btnNextRound = document.getElementById('btn-next-round');
        const roundControls = document.getElementById('round-controls');
        const historyList = document.getElementById('history-list');
        const totalRoundsCount = document.getElementById('total-rounds-count');
        const btnCopyRoom = document.getElementById('btn-copy-room');
        const btnLeaveRoom = document.getElementById('btn-leave-room');
        const choiceBtns = document.querySelectorAll('.hand-btn');

        // 預設暱稱
        playerNameInput.value = myName;

        // 彈出模態框
        function showModal(msg, icon = "🌤️") {
            document.getElementById('modal-icon').innerText = icon;
            document.getElementById('modal-message').innerText = msg;
            document.getElementById('custom-modal').classList.remove('hidden');
        }

        document.getElementById('modal-btn-close').addEventListener('click', () => {
            document.getElementById('custom-modal').classList.add('hidden');
        });

        // 產生 4 位數字房號
        function generate4DigitCode() {
            return Math.floor(1000 + Math.random() * 9000).toString();
        }

        // 複製房號
        btnCopyRoom.addEventListener('click', () => {
            if (!currentRoomCode) return;
            const tempInput = document.createElement('input');
            tempInput.value = currentRoomCode;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);
            showModal(`已複製房號：${currentRoomCode}`, "📋");
        });

        // 暱稱變更
        playerNameInput.addEventListener('change', (e) => {
            const val = e.target.value.trim();
            if (val) myName = val;
        });

        // --- 創建新房間 ---
        btnCreateRoom.addEventListener('click', async () => {
            const name = playerNameInput.value.trim() || myName;
            myName = name;

            const code = generate4DigitCode();
            currentRoomCode = code;
            roomRef = db.ref(`rooms/${code}`);

            const initialData = {
                code: code,
                createdAt: Date.now(),
                status: 'waiting',
                round: 1,
                players: {
                    [myPlayerId]: {
                        id: myPlayerId,
                        name: myName,
                        score: 0,
                        choice: null,
                        joinedAt: Date.now()
                    }
                },
                history: []
            };

            try {
                await roomRef.set(initialData);
                roomRef.child(`players/${myPlayerId}`).onDisconnect().remove();
                enterRoomView(code);
                listenToRoomUpdates(code);
            } catch (err) {
                showLobbyError("建立房間失敗：" + err.message);
            }
        });

        // --- 加入房間 ---
        btnJoinRoom.addEventListener('click', async () => {
            const code = roomCodeInput.value.trim();
            const name = playerNameInput.value.trim() || myName;
            myName = name;

            if (!code || code.length !== 4) {
                showLobbyError("請輸入有效的 4 位數字房號！");
                return;
            }

            currentRoomCode = code;
            roomRef = db.ref(`rooms/${code}`);

            try {
                const snapshot = await roomRef.once('value');
                if (!snapshot.exists()) {
                    showLobbyError("找不到該房間，請確認房號！");
                    return;
                }

                const room = snapshot.val();
                const players = room.players || {};
                const playerKeys = Object.keys(players);

                if (playerKeys.length >= 3 && !players[myPlayerId]) {
                    showLobbyError("該房間人數已滿 (上限 3 人)！");
                    return;
                }

                await roomRef.child(`players/${myPlayerId}`).set({
                    id: myPlayerId,
                    name: myName,
                    score: 0,
                    choice: null,
                    joinedAt: Date.now()
                });

                roomRef.child(`players/${myPlayerId}`).onDisconnect().remove();
                enterRoomView(code);
                listenToRoomUpdates(code);
            } catch (err) {
                showLobbyError("加入房間失敗：" + err.message);
            }
        });

        function showLobbyError(msg) {
            lobbyError.innerText = msg;
            lobbyError.classList.remove('hidden');
            setTimeout(() => lobbyError.classList.add('hidden'), 4000);
        }

        // 切換頁面
        function enterRoomView(code) {
            viewLobby.classList.add('hidden');
            viewRoom.classList.remove('hidden');
            displayRoomCode.innerText = code;
            resetChoiceUI();
        }

        // 離開房間
        btnLeaveRoom.addEventListener('click', async () => {
            if (roomRef && myPlayerId) {
                await roomRef.child(`players/${myPlayerId}`).remove();
                roomRef.off();
            }
            currentRoomCode = null;
            roomRef = null;
            viewRoom.classList.add('hidden');
            viewLobby.classList.remove('hidden');
        });

        // 監聽即時更新
        function listenToRoomUpdates(code) {
            roomRef.on('value', (snapshot) => {
                const data = snapshot.val();
                if (!data) {
                    showModal("房間已被關閉或不存在", "🌧️");
                    btnLeaveRoom.click();
                    return;
                }
                roomDataCache = data;
                renderRoomState(data);
            });
        }

        // 渲染房間狀態
        function renderRoomState(room) {
            const players = room.players || {};
            const playerList = Object.values(players);
            const count = playerList.length;

            roomPlayerCount.innerText = `👥 ${count}/3`;

            playersContainer.innerHTML = '';
            playerList.forEach(p => {
                const isMe = p.id === myPlayerId;
                const hasChosen = p.choice !== null && p.choice !== undefined && p.choice !== '';
                
                let choiceDisplay = "❓";
                if (room.status === 'revealed') {
                    choiceDisplay = getChoiceEmoji(p.choice);
                } else if (hasChosen) {
                    choiceDisplay = "✅";
                }

                const card = document.createElement('div');
                card.className = `p-3 rounded-2xl flex flex-col items-center justify-between border ${isMe ? 'bg-sky-100/80 border-sky-400 shadow-md' : 'bg-white/60 border-white/80'} transition-all`;
                card.innerHTML = `
                    <div class="text-[10px] font-bold ${isMe ? 'text-sky-700' : 'text-slate-500'} bg-white/70 px-2 py-0.5 rounded-full mb-1">
                        ${isMe ? '我自己' : '玩家'}
                    </div>
                    <div class="font-extrabold text-sm text-sky-900 truncate max-w-full mb-1">${p.name}</div>
                    <div class="text-3xl my-1 ${hasChosen || room.status === 'revealed' ? 'animate-bounce' : ''}">${choiceDisplay}</div>
                    <div class="text-xs font-black text-sky-700 bg-sky-200/50 px-2.5 py-1 rounded-lg w-full text-center">
                        得分: ${p.score || 0}
                    </div>
                `;
                playersContainer.appendChild(card);
            });

            renderHistory(room.history || []);
            totalRoundsCount.innerText = `第 ${room.round || 1} 局`;

            checkRoundLogic(room, playerList);
        }

        // 選擇出拳按鈕
        choiceBtns.forEach(btn => {
            btn.addEventListener('click', async () => {
                if (!roomRef) return;
                
                const choice = btn.getAttribute('data-choice');
                myChoice = choice;

                choiceBtns.forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');

                if (roomRef && myPlayerId) {
                    await roomRef.child(`players/${myPlayerId}/choice`).set(choice);
                }
            });
        });

        // 判斷回合階段與邏輯
        function checkRoundLogic(room, playerList) {
            const count = playerList.length;

            if (count < 2) {
                roundStatusBanner.innerHTML = `<i class="fa-solid fa-user-clock text-sky-500"></i> 等待玩家加入 (至少需要 2 人)...`;
                roundControls.classList.add('hidden');
                enableChoiceButtons(false);
                return;
            }

            const allChosen = playerList.every(p => p.choice !== null && p.choice !== undefined && p.choice !== '');

            if (room.status === 'revealed') {
                roundControls.classList.remove('hidden');
                enableChoiceButtons(false);
            } else {
                roundControls.classList.add('hidden');
                enableChoiceButtons(true);

                if (allChosen && room.status !== 'revealed') {
                    roundStatusBanner.innerHTML = `<i class="fa-solid fa-wand-magic-sparkles text-yellow-500"></i> 全員已出拳！揭曉中...`;
                    
                    const firstPlayerId = Object.keys(room.players).sort()[0];
                    if (myPlayerId === firstPlayerId) {
                        calculateAndResolveRound(room, playerList);
                    }
                } else {
                    const chosenCount = playerList.filter(p => p.choice).length;
                    roundStatusBanner.innerHTML = `<i class="fa-solid fa-hand-fist text-sky-500"></i> 請選擇出拳 (${chosenCount}/${count} 已完成)`;
                }
            }
        }

        function enableChoiceButtons(enable) {
            choiceBtns.forEach(btn => {
                if (enable) {
                    btn.removeAttribute('disabled');
                    btn.classList.remove('opacity-50', 'cursor-not-allowed');
                } else {
                    btn.setAttribute('disabled', 'true');
                    btn.classList.add('opacity-50', 'cursor-not-allowed');
                }
            });
        }

        // 計算 2~3 人勝負
        async function calculateAndResolveRound(room, playerList) {
            const choices = playerList.map(p => p.choice);
            const uniqueChoices = [...new Set(choices)];

            let winners = [];
            let resultText = "";

            if (uniqueChoices.length === 1 || uniqueChoices.length === 3) {
                resultText = "本局平手！";
            } else if (uniqueChoices.length === 2) {
                const winningChoice = getWinningChoice(uniqueChoices[0], uniqueChoices[1]);
                winners = playerList.filter(p => p.choice === winningChoice).map(p => p.id);
                
                const winnerNames = playerList.filter(p => p.choice === winningChoice).map(p => p.name).join(', ');
                resultText = `🎉 勝者：${winnerNames}！`;
            }

            const updates = {};
            const newHistory = room.history || [];

            playerList.forEach(p => {
                let currentScore = p.score || 0;
                if (winners.includes(p.id)) {
                    currentScore += 1;
                    updates[`players/${p.id}/score`] = currentScore;
                }
            });

            const historyItem = {
                round: room.round || 1,
                result: resultText,
                details: playerList.map(p => `${p.name}: ${getChoiceEmoji(p.choice)}`).join(' | ')
            };
            newHistory.unshift(historyItem);

            updates['status'] = 'revealed';
            updates['history'] = newHistory;

            await roomRef.update(updates);
        }

        // 勝負規則：rock=石頭, scissors=剪刀, paper=布
        function getWinningChoice(c1, c2) {
            if ((c1 === 'rock' && c2 === 'scissors') || (c2 === 'rock' && c1 === 'scissors')) return 'rock';
            if ((c1 === 'scissors' && c2 === 'paper') || (c2 === 'scissors' && c1 === 'paper')) return 'scissors';
            if ((c1 === 'paper' && c2 === 'rock') || (c2 === 'paper' && c1 === 'rock')) return 'paper';
            return null;
        }

        function getChoiceEmoji(c) {
            switch(c) {
                case 'rock': return '✊';
                case 'scissors': return '✌️';
                case 'paper': return '✋';
                default: return '❓';
            }
        }

        // 下一局
        btnNextRound.addEventListener('click', async () => {
            resetChoiceUI();
            if (!roomRef) return;

            const snapshot = await roomRef.once('value');
            const room = snapshot.val();
            const players = room.players || {};

            const updates = {};
            Object.keys(players).forEach(pid => {
                updates[`players/${pid}/choice`] = null;
            });
            updates['status'] = 'playing';
            updates['round'] = (room.round || 1) + 1;

            await roomRef.update(updates);
        });

        function resetChoiceUI() {
            myChoice = null;
            choiceBtns.forEach(b => b.classList.remove('selected'));
        }

        function renderHistory(historyArray) {
            if (!historyArray || historyArray.length === 0) {
                historyList.innerHTML = `<div class="text-center text-sky-600/60 py-2 italic text-xs">暫無紀錄，等待出拳...</div>`;
                return;
            }

            historyList.innerHTML = '';
            historyArray.forEach(item => {
                const div = document.createElement('div');
                div.className = "bg-white/60 p-2 rounded-xl flex flex-col gap-0.5 border border-white/80 shadow-2xs";
                div.innerHTML = `
                    <div class="flex justify-between items-center font-bold">
                        <span class="text-sky-900">第 ${item.round} 局</span>
                        <span class="text-emerald-600 font-extrabold">${item.result}</span>
                    </div>
                    <div class="text-[11px] text-sky-800/80">${item.details}</div>
                `;
                historyList.appendChild(div);
            });
        }
    </script>
</body>
</html>
