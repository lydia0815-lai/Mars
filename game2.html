<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>線上雙人猜拳對戰</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Firebase SDK (v13.0.0 Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-analytics.js";
        import { getDatabase, ref, set, get, onValue, remove, serverTimestamp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-database.js";

        // 你的 Firebase 設定
        const firebaseConfig = {
            apiKey: "AIzaSyD_XwMWXpUg3OJZBLx0e1A2LKNFl3mpnn8",
            authDomain: "project-9055340413398078399.firebaseapp.com",
            databaseURL: "https://project-9055340413398078399-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "project-9055340413398078399",
            storageBucket: "project-9055340413398078399.firebasestorage.app",
            messagingSenderId: "984429802835",
            appId: "1:984429802835:web:038d4191feb28d93259da6",
            measurementId: "G-Z5D344VKHP"
        };

        // 初始化 Firebase
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getDatabase(app);

        // ==========================================
        // 全域狀態變數
        // ==========================================
        let currentUser = {
            id: 'user_' + Math.random().toString(36).substr(2, 9),
            name: '',
            role: null, // 'p1', 'p2', or 'spectator'
            choice: null
        };

        let currentRoomCode = null;
        let roomRef = null;
        let roomUnsubscribe = null;

        const CHOICES = {
            scissors: { emoji: '✌️', name: '剪刀' },
            rock: { emoji: '✊', name: '石頭' },
            paper: { emoji: '✋', name: '布' }
        };

        // ==========================================
        // DOM 元素參考
        // ==========================================
        const views = {
            lobby: document.getElementById('view-lobby'),
            room: document.getElementById('view-room')
        };

        const inputs = {
            nickname: document.getElementById('input-nickname'),
            roomCode: document.getElementById('input-room-code')
        };

        const buttons = {
            create: document.getElementById('btn-create-room'),
            join: document.getElementById('btn-join-room'),
            leave: document.getElementById('btn-leave-room'),
            choices: document.querySelectorAll('.choice-btn')
        };

        const displays = {
            roomCode: document.getElementById('display-room-code'),
            playerCount: document.getElementById('display-player-count'),
            result: document.getElementById('display-result'),
            actionHint: document.getElementById('action-hint'),
            p1Name: document.getElementById('p1-name'),
            p1Status: document.getElementById('p1-status'),
            p1Choice: document.getElementById('p1-choice'),
            cardP1: document.getElementById('card-p1'),
            p2Name: document.getElementById('p2-name'),
            p2Status: document.getElementById('p2-status'),
            p2Choice: document.getElementById('p2-choice'),
            cardP2: document.getElementById('card-p2'),
            spectatorBox: document.getElementById('box-spectator'),
            spectatorName: document.getElementById('spectator-name'),
            areaControls: document.getElementById('area-controls')
        };

        // 自動還原上次暱稱
        const savedName = localStorage.getItem('rps_nickname');
        if (savedName) inputs.nickname.value = savedName;

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        function switchView(viewName) {
            Object.keys(views).forEach(key => {
                views[key].classList.toggle('active', key === viewName);
            });
        }

        function generateRoomCode() {
            return Math.floor(1000 + Math.random() * 9000).toString();
        }

        function validateNickname() {
            const name = inputs.nickname.value.trim();
            if (!name) {
                showToast('請先輸入玩家暱稱！');
                inputs.nickname.focus();
                return null;
            }
            localStorage.setItem('rps_nickname', name);
            currentUser.name = name;
            return name;
        }

        // ==========================================
        // 創建新房間
        // ==========================================
        buttons.create.addEventListener('click', async () => {
            if (!validateNickname()) return;

            const code = generateRoomCode();
            const newRoomRef = ref(db, `rooms/${code}`);

            try {
                const snapshot = await get(newRoomRef);
                if (snapshot.exists()) {
                    buttons.create.click();
                    return;
                }

                const initialData = {
                    createdAt: serverTimestamp(),
                    players: {
                        p1: {
                            id: currentUser.id,
                            name: currentUser.name,
                            choice: ""
                        }
                    }
                };

                await set(newRoomRef, initialData);
                currentUser.role = 'p1';
                enterRoom(code);
            } catch (err) {
                showToast('建立失敗，請檢查 Firebase 資料庫權限');
                console.error(err);
            }
        });

        // ==========================================
        // 加入房間
        // ==========================================
        buttons.join.addEventListener('click', async () => {
            if (!validateNickname()) return;

            const code = inputs.roomCode.value.trim();
            if (code.length !== 4 || !/^\d{4}$/.test(code)) {
                showToast('請輸入 4 位數數字房號！');
                return;
            }

            const targetRoomRef = ref(db, `rooms/${code}`);

            try {
                const snapshot = await get(targetRoomRef);
                if (!snapshot.exists()) {
                    showToast('找不到該房間，請檢查房號');
                    return;
                }

                const data = snapshot.val();
                const players = data.players || {};
                const playerCount = Object.keys(players).length;

                if (playerCount >= 3) {
                    showToast('房間人數已滿 (上限 3 人)');
                    return;
                }

                let assignedRole = '';
                if (!players.p1) {
                    assignedRole = 'p1';
                } else if (!players.p2) {
                    assignedRole = 'p2';
                } else {
                    assignedRole = 'spectator';
                }

                currentUser.role = assignedRole;

                await set(ref(db, `rooms/${code}/players/${assignedRole}`), {
                    id: currentUser.id,
                    name: currentUser.name,
                    choice: ""
                });

                enterRoom(code);
            } catch (err) {
                showToast('加入房間失敗，請稍後再試');
                console.error(err);
            }
        });

        // ==========================================
        // 進入房間與即時監聽
        // ==========================================
        function enterRoom(code) {
            currentRoomCode = code;
            displays.roomCode.textContent = code;
            roomRef = ref(db, `rooms/${code}`);

            // 開啟即時監聽
            roomUnsubscribe = onValue(roomRef, (snapshot) => {
                if (!snapshot.exists()) {
                    showToast('房間已關閉');
                    exitRoom(false);
                    return;
                }
                updateRoomUI(snapshot.val());
            });

            switchView('room');
            showToast(`已成功進入房間 ${code}`);
        }

        // ==========================================
        // UI 更新與勝負判定
        // ==========================================
        function updateRoomUI(data) {
            const players = data.players || {};
            const p1 = players.p1;
            const p2 = players.p2;
            const spectator = players.spectator;

            const count = Object.keys(players).length;
            displays.playerCount.textContent = `${count} / 3 人`;

            if (p1) {
                displays.p1Name.textContent = p1.name + (currentUser.role === 'p1' ? ' (你)' : '');
                displays.p1Status.textContent = p1.choice ? '已出拳' : '思考中...';
                displays.cardP1.classList.toggle('is-me', currentUser.role === 'p1');
            } else {
                displays.p1Name.textContent = '等待玩家入座...';
                displays.p1Status.textContent = '離線';
                displays.p1Choice.textContent = '❓';
                displays.cardP1.classList.remove('is-me');
            }

            if (p2) {
                displays.p2Name.textContent = p2.name + (currentUser.role === 'p2' ? ' (你)' : '');
                displays.p2Status.textContent = p2.choice ? '已出拳' : '思考中...';
                displays.cardP2.classList.toggle('is-me', currentUser.role === 'p2');
            } else {
                displays.p2Name.textContent = '等待玩家入座...';
                displays.p2Status.textContent = '離線';
                displays.p2Choice.textContent = '❓';
                displays.cardP2.classList.remove('is-me');
            }

            if (spectator) {
                displays.spectatorBox.style.display = 'block';
                displays.spectatorName.textContent = spectator.name + (currentUser.role === 'spectator' ? ' (你)' : '');
            } else {
                displays.spectatorBox.style.display = 'none';
            }

            if (currentUser.role === 'spectator') {
                displays.areaControls.style.display = 'none';
            } else {
                displays.areaControls.style.display = 'flex';
                const myChoice = players[currentUser.role]?.choice || null;
                buttons.choices.forEach(btn => {
                    const type = btn.getAttribute('data-choice');
                    btn.classList.toggle('selected', type === myChoice);
                });
            }

            if (!p1 || !p2) {
                displays.p1Choice.textContent = '❓';
                displays.p2Choice.textContent = '❓';
                displays.result.textContent = '等待對手加入中...';
                displays.actionHint.textContent = '等待對手入座';
                toggleChoiceButtons(false);
                return;
            }

            toggleChoiceButtons(true);

            const p1Val = p1.choice;
            const p2Val = p2.choice;

            if (!p1Val || !p2Val) {
                displays.p1Choice.textContent = p1Val ? '🔒' : '❓';
                displays.p2Choice.textContent = p2Val ? '🔒' : '❓';

                if (currentUser.role !== 'spectator') {
                    const myVal = players[currentUser.role]?.choice;
                    displays.actionHint.textContent = myVal ? '等待對手出拳...' : '請選擇你的出拳';
                } else {
                    displays.actionHint.textContent = '對戰進行中...';
                }

                displays.result.textContent = (p1Val || p2Val) ? '有一方已準備出拳...' : '雙方思考中...';
            } else {
                displays.p1Choice.textContent = CHOICES[p1Val].emoji;
                displays.p2Choice.textContent = CHOICES[p2Val].emoji;

                const outcome = getWinner(p1Val, p2Val);
                if (outcome === 'draw') {
                    displays.result.textContent = '🤝 平手！再試一次';
                } else if (outcome === 'p1') {
                    displays.result.textContent = `🎉 ${p1.name} 獲勝！`;
                } else {
                    displays.result.textContent = `🎉 ${p2.name} 獲勝！`;
                }

                displays.actionHint.textContent = '點選下方可隨時改拳重玩';
            }
        }

        function toggleChoiceButtons(enabled) {
            buttons.choices.forEach(btn => btn.disabled = !enabled);
        }

        function getWinner(c1, c2) {
            if (c1 === c2) return 'draw';
            if (
                (c1 === 'scissors' && c2 === 'paper') ||
                (c1 === 'rock' && c2 === 'scissors') ||
                (c1 === 'paper' && c2 === 'rock')
            ) {
                return 'p1';
            }
            return 'p2';
        }

        // ==========================================
        // 點選出拳
        // ==========================================
        buttons.choices.forEach(btn => {
            btn.addEventListener('click', async () => {
                if (!roomRef || currentUser.role === 'spectator') return;

                const choice = btn.getAttribute('data-choice');
                currentUser.choice = choice;

                try {
                    await set(ref(db, `rooms/${currentRoomCode}/players/${currentUser.role}/choice`), choice);
                } catch (err) {
                    console.error("出拳同步失敗:", err);
                }
            });
        });

        // ==========================================
        // 離開房間
        // ==========================================
        async function exitRoom(manual = true) {
            if (roomRef && currentUser.role) {
                if (manual) {
                    try {
                        await remove(ref(db, `rooms/${currentRoomCode}/players/${currentUser.role}`));
                    } catch (e) {
                        console.error(e);
                    }
                }
                if (roomUnsubscribe) {
                    roomUnsubscribe();
                }
            }

            currentRoomCode = null;
            roomRef = null;
            currentUser.role = null;
            currentUser.choice = null;

            switchView('lobby');
        }

        buttons.leave.addEventListener('click', () => exitRoom(true));
    </script>

    <style>

            --card-bg: #FFFFFF;

        .container {
            width: 100%;

        }

        input[type="text"] {

        .player-card {

        }

<body>

    <div class="container">
        <!-- Toast 通知 -->
        <div id="toast" class="toast">提示訊息</div>

        <!-- 標頭 -->
        <div class="header">
            <h1>剪刀石頭布</h1>
            <p>線上雙人即時連線對戰</p>
        </div>

        <!-- 1. 暱稱設定與大廳視圖 -->
        <div id="view-lobby" class="view active">
            <div class="input-group">
                <label for="input-nickname">玩家暱稱</label>
                <input type="text" id="input-nickname" placeholder="請輸入暱稱" maxlength="8">
            </div>

            <button class="btn" id="btn-create-room">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                創建新房間 (4位數房號)
            </button>

            <div class="divider"><span>或是加入已有房間</span></div>

            <div class="input-group">
                <input type="text" id="input-room-code" placeholder="輸入 4 位數房號" maxlength="4" pattern="[0-9]*" inputmode="numeric">
            </div>

            <button class="btn btn-secondary" id="btn-join-room">加入房間</button>
        </div>

        <!-- 2. 遊戲房間視圖 -->
        <div id="view-room" class="view">
            <!-- 房間資訊 -->
            <div class="room-bar">
                <div class="room-info">
                    <span class="label">房間號碼</span>
                    <span class="code" id="display-room-code">----</span>
                </div>
                <div class="player-count-badge" id="display-player-count">1 / 3 人</div>
            </div>

            <!-- 玩家列表看板 -->
            <div class="game-board">
                <!-- 玩家 P1 -->
                <div class="player-card" id="card-p1">
                    <div class="player-meta">
                        <div class="avatar" id="p1-avatar">1</div>
                        <div class="player-info">
                            <span class="player-name" id="p1-name">等待對手...</span>
                            <span class="player-status" id="p1-status">未準備</span>
                        </div>
                    </div>
                    <div class="player-choice-display" id="p1-choice">❓</div>
                </div>

                <!-- 玩家 P2 -->
                <div class="player-card" id="card-p2">
                    <div class="player-meta">
                        <div class="avatar" id="p2-avatar">2</div>
                        <div class="player-info">
                            <span class="player-name" id="p2-name">等待對手...</span>
                            <span class="player-status" id="p2-status">未準備</span>
                        </div>
                    </div>
                    <div class="player-choice-display" id="p2-choice">❓</div>
                </div>
            </div>

            <!-- 觀戰者提示 -->
            <div class="spectator-box" id="box-spectator" style="display: none;">
                👀 觀戰中：<strong id="spectator-name">無</strong>
            </div>

            <!-- 結果公告 -->
            <div class="result-banner" id="display-result">
                等待兩位玩家出拳...
            </div>

            <!-- 出拳按鈕區域 -->
            <div class="action-area" id="area-controls">
                <div class="action-title" id="action-hint">選擇你的出拳</div>
                <div class="choices-grid">
                    <button class="choice-btn" data-choice="scissors">
                        <span class="emoji">✌️</span>
                        <span class="label">剪刀</span>
                    </button>
                    <button class="choice-btn" data-choice="rock">
                        <span class="emoji">✊</span>
                        <span class="label">石頭</span>
                    </button>
                    <button class="choice-btn" data-choice="paper">
                        <span class="emoji">✋</span>
                        <span class="label">布</span>
                    </button>
                </div>
            </div>

            <button class="btn btn-outline" id="btn-leave-room">離開房間</button>
        </div>
    </div>
</body>
</html>
