<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>蛇來運轉 - 可愛貪食蛇</title>
    <style>
        :root {
            --bg-color: #0f0c1b;
            --grid-line: #221b3d;
            --neon-pink: #e63946;
            --neon-cyan: #457b9d;
            --neon-yellow: #f4a261;
            --neon-purple: #6d597a;
            --card-bg: rgba(25, 20, 45, 0.85);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
                linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
            background-size: 30px 30px;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 10px;
            overflow-x: hidden;
        }

        /* 頂部導覽 */
        header {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .back-btn {
            color: var(--neon-cyan);
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            padding: 6px 14px;
            background: rgba(69, 123, 157, 0.15);
            border: 1px solid var(--neon-cyan);
            border-radius: 20px;
            box-shadow: 0 0 5px rgba(69, 123, 157, 0.2);
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            background: var(--neon-cyan);
            color: #000;
        }

        .title {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(45deg, #f1faee, var(--neon-yellow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 5px rgba(244, 162, 97, 0.3);
        }

        /* 儀表板 */
        .dashboard {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: space-around;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 10px;
            margin-bottom: 10px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(4px);
        }

        .score-box {
            text-align: center;
        }

        .score-label {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 2px;
        }

        .score-val {
            font-size: 18px;
            font-weight: bold;
            color: var(--neon-yellow);
            text-shadow: 0 0 4px rgba(244, 162, 97, 0.5);
        }

        /* 遊戲畫布容器 */
        .game-container {
            position: relative;
            width: 100%;
            max-width: 480px;
            aspect-ratio: 1 / 1;
            background: rgba(10, 8, 20, 0.9);
            border: 2px solid var(--neon-cyan);
            border-radius: 20px;
            box-shadow: 0 0 10px rgba(69, 123, 157, 0.3);
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Overlay 遊戲結束/暫停/開始 */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 12, 27, 0.95);
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            padding: 20px;
            transition: opacity 0.3s ease;
        }

        .overlay.hidden {
            display: none;
        }

        .overlay-title {
            font-size: 26px;
            font-weight: bold;
            color: var(--neon-yellow);
            text-shadow: 0 0 8px rgba(244, 162, 97, 0.4);
            margin-bottom: 6px;
        }

        .overlay-msg {
            font-size: 14px;
            color: #ddd;
            margin-bottom: 12px;
            text-align: center;
            line-height: 1.5;
        }

        .tutorial-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 15px;
            text-align: left;
            width: 100%;
            max-width: 340px;
        }

        .tutorial-title {
            font-size: 13px;
            font-weight: bold;
            color: var(--neon-yellow);
            margin-bottom: 6px;
            text-align: center;
        }

        .tutorial-item {
            font-size: 12px;
            color: #ccc;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-restart {
            padding: 10px 24px;
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            background: linear-gradient(45deg, #2a9d8f, #264653);
            border: none;
            border-radius: 25px;
            box-shadow: 0 0 8px rgba(42, 157, 143, 0.4);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 5px;
        }

        .btn-restart:active {
            transform: scale(0.95);
            box-shadow: 0 0 3px rgba(42, 157, 143, 0.4);
        }

        /* 暱稱輸入框樣式 */
        .input-group {
            display: flex;
            gap: 8px;
            width: 100%;
            max-width: 320px;
            margin-bottom: 10px;
        }

        .player-input {
            flex: 1;
            padding: 8px 14px;
            border-radius: 20px;
            border: 1px solid var(--neon-cyan);
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            font-size: 14px;
            outline: none;
            text-align: center;
            user-select: auto;
            -webkit-user-select: auto;
        }

        .player-input:focus {
            box-shadow: 0 0 6px var(--neon-cyan);
        }

        .btn-submit {
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            color: #000;
            background: var(--neon-cyan);
            border: none;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 0 6px var(--neon-cyan);
            white-space: nowrap;
        }

        .btn-submit:disabled {
            background: #555;
            color: #888;
            box-shadow: none;
            cursor: not-allowed;
        }

        /* 排行榜表格樣式 */
        .leaderboard-box {
            width: 100%;
            max-width: 340px;
            max-height: 150px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 8px;
            margin-bottom: 8px;
        }

        .leaderboard-title {
            font-size: 13px;
            font-weight: bold;
            color: var(--neon-yellow);
            text-align: center;
            margin-bottom: 6px;
        }

        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        .leaderboard-table th, .leaderboard-table td {
            padding: 4px 8px;
            text-align: center;
        }

        .leaderboard-table th {
            color: #aaa;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .leaderboard-table td {
            color: #fff;
        }

        .leaderboard-table tr:nth-child(1) td { color: #f4a261; font-weight: bold; }
        .leaderboard-table tr:nth-child(2) td { color: #e0e0e0; font-weight: bold; }
        .leaderboard-table tr:nth-child(3) td { color: #cd7f32; font-weight: bold; }

        /* 手機觸控操作區 */
        .controls {
            width: 100%;
            max-width: 480px;
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .control-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            width: 100%;
        }

        .touch-btn {
            width: 55px;
            height: 55px;
            background: var(--card-bg);
            border: 1px solid var(--neon-cyan);
            border-radius: 50%;
            color: var(--neon-cyan);
            font-size: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 5px rgba(69, 123, 157, 0.2);
            touch-action: manipulation;
            transition: background 0.1s, transform 0.1s;
        }

        .touch-btn:active {
            background: var(--neon-cyan);
            color: #000;
            transform: scale(0.9);
        }

        .btn-space {
            width: 110px;
            border-radius: 28px;
            font-size: 13px;
            font-weight: bold;
            border-color: var(--neon-yellow);
            color: var(--neon-yellow);
        }

        .btn-space:active {
            background: var(--neon-yellow);
            color: #000;
        }

        .hint {
            font-size: 11px;
            color: #666;
            margin-top: 8px;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="back-btn">← 回首頁</a>
        <div class="title">🐍 蛇來運轉</div>
    </header>

    <div class="dashboard">
        <div class="score-box">
            <div class="score-label">目前分數</div>
            <div id="score" class="score-val">0</div>
        </div>
        <div class="score-box">
            <div class="score-label">目前關卡</div>
            <div id="levelName" class="score-val">Level 1: 霓虹都市</div>
        </div>
        <div class="score-box">
            <div class="score-label">最高紀錄</div>
            <div id="highScore" class="score-val">0</div>
        </div>
    </div>

    <!-- 遊戲畫布與畫面重疊層 -->
    <div class="game-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>

        <!-- 遊戲結束 Overlay -->
        <div id="gameOverOverlay" class="overlay hidden">
            <div class="overlay-title">遊戲結束</div>
            <div id="finalScoreMsg" class="overlay-msg">得分：0</div>

            <div class="input-group">
                <input type="text" id="playerName" class="player-input" placeholder="輸入玩家暱稱" maxlength="10">
                <button id="submitScoreBtn" class="btn-submit" onclick="submitScore()">儲存紀錄</button>
            </div>

            <div class="leaderboard-box">
                <div class="leaderboard-title">🏆 雲端 TOP 10 排行榜</div>
                <table class="leaderboard-table">
                    <thead>
                        <tr>
                            <th>名次</th>
                            <th>暱稱</th>
                            <th>分數</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboardBody">
                        <tr><td colspan="3">排行榜載入中...</td></tr>
                    </tbody>
                </table>
            </div>

            <button class="btn-restart" onclick="resetGame()">重新開始</button>
        </div>

        <!-- 開始遊戲與教學 Overlay -->
        <div id="startOverlay" class="overlay">
            <div class="overlay-title">蛇來運轉 🌟</div>
            <div class="overlay-msg">探索多樣大自然與都市關卡，挑戰自我！</div>
            
            <!-- 教學區塊放置於開始畫面 -->
            <div class="tutorial-box">
                <div class="tutorial-title">📖 遊戲操作教學</div>
                <div class="tutorial-item">⌨️ <b>方向鍵：</b>[↑] [↓] [←] [→] 控制蛇的移動方向</div>
                <div class="tutorial-item">⏸️ <b>空白鍵 (Space)：</b>暫停與繼續遊戲</div>
                <div class="tutorial-item">🍎 <b>得分規則：</b>每吃一個果實得 10 分</div>
                <div class="tutorial-item">🌍 <b>關卡切換：</b>每滿 40 分自動切換新自然背景風景</div>
            </div>

            <button class="btn-restart" onclick="startGame()">開始遊戲</button>
        </div>
    </div>

    <!-- 手機觸控操作盤 -->
    <div class="controls">
        <div class="control-row">
            <button class="touch-btn" onclick="handleDirection('UP')">▲</button>
        </div>
        <div class="control-row">
            <button class="touch-btn" onclick="handleDirection('LEFT')">◄</button>
            <button class="touch-btn btn-space" onclick="togglePause()">暫停/開始</button>
            <button class="touch-btn" onclick="handleDirection('RIGHT')">►</button>
        </div>
        <div class="control-row">
            <button class="touch-btn" onclick="handleDirection('DOWN')">▼</button>
        </div>
    </div>

    <div class="hint">電腦操控：方向鍵移動，空白鍵暫停（已防止畫面捲動）</div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxBX9jVO_hrad8QP0Gcz7kGy4e1U5MZQgNe9FC1E25eOEMhFTPyfTjCzzxNfDx_jCI5/exec";

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const gridSize = 20; 
        const tileSize = canvas.width / gridSize; 

        let snake = [];
        let food = { x: 0, y: 0 };
        let dx = tileSize;
        let dy = 0;
        let nextDx = tileSize;
        let nextDy = 0;

        let score = 0;
        let currentLevel = 1;
        let highScore = localStorage.getItem('snake_high_score') || 0;
        document.getElementById('highScore').innerText = highScore;

        const savedName = localStorage.getItem('snake_player_name') || '';
        document.getElementById('playerName').value = savedName;

        let gameLoop = null;
        let isRunning = false;
        let isPaused = false;
        let speed = 130; 

        // 定義關卡主題與背景配色 (降低暈光，減少視覺疲勞)
        const levels = [
            {
                id: 1,
                name: "Level 1: 霓虹都市",
                bgColor: "#0a0a16",
                gridColor: "rgba(69, 123, 157, 0.08)",
                foodColor: "#f4a261",
                snakeHead: "#e63946",
                snakeBody1: "#457b9d",
                snakeBody2: "#1d3557"
            },
            {
                id: 2,
                name: "Level 2: 綠意草地",
                bgColor: "#132210",
                gridColor: "rgba(167, 201, 87, 0.1)",
                foodColor: "#ffb703",
                snakeHead: "#fb8500",
                snakeBody1: "#606c38",
                snakeBody2: "#283618"
            },
            {
                id: 3,
                name: "Level 3: 泥土大地",
                bgColor: "#221914",
                gridColor: "rgba(221, 161, 94, 0.1)",
                foodColor: "#e9c46a",
                snakeHead: "#e76f51",
                snakeBody1: "#b5838d",
                snakeBody2: "#6d597a"
            },
            {
                id: 4,
                name: "Level 4: 魔幻森林",
                bgColor: "#101d24",
                gridColor: "rgba(72, 202, 228, 0.1)",
                foodColor: "#ff70a6",
                snakeHead: "#70d6ff",
                snakeBody1: "#ff9770",
                snakeBody2: "#ffd670"
            }
        ];

        function initGame() {
            snake = [
                { x: 5 * tileSize, y: 10 * tileSize },
                { x: 4 * tileSize, y: 10 * tileSize },
                { x: 3 * tileSize, y: 10 * tileSize }
            ];
            dx = tileSize;
            dy = 0;
            nextDx = tileSize;
            nextDy = 0;
            score = 0;
            currentLevel = 1;
            updateLevelDisplay();
            document.getElementById('score').innerText = score;
            spawnFood();
        }

        function updateLevelDisplay() {
            // 每 40 分升一級 (最高到第 4 關循環)
            let lvlIndex = Math.floor(score / 40) % levels.length;
            currentLevel = lvlIndex + 1;
            document.getElementById('levelName').innerText = levels[lvlIndex].name;
        }

        function spawnFood() {
            food.x = Math.floor(Math.random() * gridSize) * tileSize;
            food.y = Math.floor(Math.random() * gridSize) * tileSize;

            snake.forEach(part => {
                if (part.x === food.x && part.y === food.y) {
                    spawnFood();
                }
            });
        }

        function startGame() {
            document.getElementById('startOverlay').classList.add('hidden');
            document.getElementById('gameOverOverlay').classList.add('hidden');
            initGame();
            isRunning = true;
            isPaused = false;
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(update, speed);
        }

        function resetGame() {
            startGame();
        }

        function togglePause() {
            if (!isRunning) {
                startGame();
                return;
            }
            isPaused = !isPaused;
            if (isPaused) {
                clearInterval(gameLoop);
            } else {
                gameLoop = setInterval(update, speed);
            }
        }

        function update() {
            if (isPaused) return;

            dx = nextDx;
            dy = nextDy;

            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
                return gameOver();
            }

            for (let i = 0; i < snake.length; i++) {
                if (snake[i].x === head.x && snake[i].y === head.y) {
                    return gameOver();
                }
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById('score').innerText = score;
                updateLevelDisplay();

                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('snake_high_score', highScore);
                    document.getElementById('highScore').innerText = highScore;
                }

                spawnFood();
            } else {
                snake.pop();
            }

            draw();
        }

        function draw() {
            let themeIndex = (currentLevel - 1) % levels.length;
            let theme = levels[themeIndex];

            // 背景清空
            ctx.fillStyle = theme.bgColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 繪製背景網格元素
            ctx.strokeStyle = theme.gridColor;
            for (let i = 0; i < canvas.width; i += tileSize) {
                ctx.beginPath();
                ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height);
                ctx.moveTo(0, i); ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }

            // 食物：降低暈光數值 (shadowBlur = 4)，避免視覺疲勞
            ctx.shadowBlur = 4;
            ctx.shadowColor = theme.foodColor;
            ctx.fillStyle = theme.foodColor;
            ctx.beginPath();
            ctx.arc(food.x + tileSize / 2, food.y + tileSize / 2, tileSize / 2 - 2, 0, Math.PI * 2);
            ctx.fill();

            // 貪食蛇繪製
            snake.forEach((part, index) => {
                if (index === 0) {
                    // 蛇頭：溫和陰影
                    ctx.shadowBlur = 5;
                    ctx.shadowColor = theme.snakeHead;
                    ctx.fillStyle = theme.snakeHead;

                    ctx.beginPath();
                    ctx.roundRect(part.x + 1, part.y + 1, tileSize - 2, tileSize - 2, 6);
                    ctx.fill();

                    // 眼睛
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#ffffff';

                    let eyeX1 = part.x + 5, eyeY1 = part.y + 5;
                    let eyeX2 = part.x + 13, eyeY2 = part.y + 5;

                    if (dx === tileSize) { eyeX1 = part.x + 11; eyeX2 = part.x + 11; eyeY1 = part.y + 5; eyeY2 = part.y + 13; }
                    else if (dx === -tileSize) { eyeX1 = part.x + 5; eyeX2 = part.x + 5; eyeY1 = part.y + 5; eyeY2 = part.y + 13; }
                    else if (dy === tileSize) { eyeX1 = part.x + 5; eyeX2 = part.x + 13; eyeY1 = part.y + 11; eyeY2 = part.y + 11; }

                    ctx.beginPath();
                    ctx.arc(eyeX1, eyeY1, 2, 0, Math.PI * 2);
                    ctx.arc(eyeX2, eyeY2, 2, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    // 身體：交錯漸層色
                    ctx.shadowBlur = 3;
                    ctx.shadowColor = theme.snakeBody1;
                    ctx.fillStyle = index % 2 === 0 ? theme.snakeBody1 : theme.snakeBody2;

                    ctx.beginPath();
                    ctx.roundRect(part.x + 2, part.y + 2, tileSize - 4, tileSize - 4, 4);
                    ctx.fill();
                }
            });

            ctx.shadowBlur = 0; 
        }

        function gameOver() {
            clearInterval(gameLoop);
            isRunning = false;
            document.getElementById('finalScoreMsg').innerText = `本次得分：${score} (到達 ${document.getElementById('levelName').innerText})`;
            
            const submitBtn = document.getElementById('submitScoreBtn');
            submitBtn.disabled = false;
            submitBtn.innerText = '儲存紀錄';

            document.getElementById('gameOverOverlay').classList.remove('hidden');
            fetchLeaderboard();
        }

        function handleDirection(dir) {
            if (dir === 'LEFT' && dx === 0) { nextDx = -tileSize; nextDy = 0; }
            else if (dir === 'UP' && dy === 0) { nextDx = 0; nextDy = -tileSize; }
            else if (dir === 'RIGHT' && dx === 0) { nextDx = tileSize; nextDy = 0; }
            else if (dir === 'DOWN' && dy === 0) { nextDx = 0; nextDy = tileSize; }
        }

        // 鍵盤監聽事件：加入 preventDefault 阻止上下左右鍵及空白鍵捲動網頁
        window.addEventListener('keydown', e => {
            if (document.activeElement.tagName === 'INPUT') return;

            if (['ArrowLeft', 'ArrowUp', 'ArrowRight', 'ArrowDown', ' '].includes(e.key)) {
                e.preventDefault();
            }

            if (e.key === 'ArrowLeft') handleDirection('LEFT');
            else if (e.key === 'ArrowUp') handleDirection('UP');
            else if (e.key === 'ArrowRight') handleDirection('RIGHT');
            else if (e.key === 'ArrowDown') handleDirection('DOWN');
            else if (e.key === ' ' || e.code === 'Space') {
                togglePause();
            }
        });

        async function fetchLeaderboard() {
            const tbody = document.getElementById('leaderboardBody');
            tbody.innerHTML = '<tr><td colspan="3">載入中...</td></tr>';

            try {
                const response = await fetch(`${API_URL}?action=getTop10`);
                const result = await response.json();

                if (result.status === 'success') {
                    renderLeaderboard(result.data);
                } else {
                    tbody.innerHTML = '<tr><td colspan="3">無法讀取排行榜</td></tr>';
                }
            } catch (err) {
                console.error('Fetch error:', err);
                tbody.innerHTML = '<tr><td colspan="3">網路連線失敗</td></tr>';
            }
        }

        function renderLeaderboard(data) {
            const tbody = document.getElementById('leaderboardBody');
            tbody.innerHTML = '';

            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3">尚無紀錄，快來搶頭香！</td></tr>';
                return;
            }

            data.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${escapeHtml(item.name)}</td>
                    <td>${item.score}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function submitScore() {
            const nameInput = document.getElementById('playerName');
            const submitBtn = document.getElementById('submitScoreBtn');
            const name = nameInput.value.trim() || '匿名玩家';

            localStorage.setItem('snake_player_name', name);

            submitBtn.disabled = true;
            submitBtn.innerText = '上傳中...';

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'text/plain;charset=utf-8',
                    },
                    body: JSON.stringify({
                        name: name,
                        score: score
                    })
                });

                const result = await response.json();
                if (result.status === 'success') {
                    submitBtn.innerText = '已儲存！';
                    fetchLeaderboard();
                } else {
                    submitBtn.disabled = false;
                    submitBtn.innerText = '重試';
                }
            } catch (err) {
                console.error('Submit error:', err);
                submitBtn.disabled = false;
                submitBtn.innerText = '重試';
            }
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // 初始化靜態繪製畫面
        draw();
    </script>
</body>
</html>
