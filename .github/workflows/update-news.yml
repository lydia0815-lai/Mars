name: Update Google News

env:
  RSS_URL: 'https://www.google.com/alerts/feeds/10778649762504101741/8116942284729616181'

on:
  schedule:
    # 每天台灣時間早上 8 點 (UTC 0 點) 執行
    - cron: '0 0 * * *'
  workflow_dispatch:  # 支援手動執行

jobs:
  update-news:
  
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install feedparser
        run: pip install feedparser

      - name: Fetch and convert RSS to JSON
        run: |
          python -c "
          import feedparser, json, os

          rss_url = os.environ['RSS_URL']
          feed = feedparser.parse(rss_url)
          items = []

          for entry in feed.entries[:10]:
              items.append({
                  'title': entry.get('title', ''),
                  'link': entry.get('link', ''),
                  'published': entry.get('published', '')
              })

          with open('news.json', 'w', encoding='utf-8') as f:
              json.dump(items, f, ensure_ascii=False, indent=2)
          "

      - name: Commit and push if news changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add news.json
          git diff --staged --quiet || (git commit -m 'Auto-update news.json' && git push)
