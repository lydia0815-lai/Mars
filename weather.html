<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>生活天氣預報｜即時氣象與穿搭、跑步建議</title>
  <meta name="description" content="提供台北與所在地的即時天氣、未來7天預報，並貼心提供帶傘提醒、每日穿搭、戶外跑步與夜間出遊生活建議。" />
  
  <!-- 分頁小圖示 -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <!-- Google Analytics (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-Z5D344VKHP"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-Z5D344VKHP');
  </script>

  <!-- Google Fonts: Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #fbf7f2;
      --card-bg: #ffffff;
      --card-warm: #fff8ef;
      --primary: #d97736;
      --primary-hover: #c06224;
      --primary-light: #fbead8;
      --text-main: #3d312a;
      --text-muted: #7a6a5e;
      --border-color: #efe4d8;
      --shadow: 0 8px 24px rgba(105, 75, 50, 0.07);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      padding: 20px 16px 48px;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
    }

    /* 頂部導覽與控制列 */
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .location-title-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .location-badge {
      background-color: var(--primary-light);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      padding: 4px 10px;
      border-radius: 20px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .btn-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      font-family: inherit;
      font-size: 0.92rem;
      font-weight: 500;
      border: none;
      border-radius: 12px;
      padding: 10px 16px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-primary {
      background-color: var(--primary);
      color: #fff;
      box-shadow: 0 4px 12px rgba(217, 119, 54, 0.25);
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
    }

    .btn-primary:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    .btn-secondary {
      background-color: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    .btn-secondary:hover {
      background-color: var(--card-warm);
    }

    .status-msg {
      font-size: 0.88rem;
      color: var(--primary);
      margin-bottom: 14px;
      min-height: 1.4em;
    }

    /* 通用卡片樣式 */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 22px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 1.12rem;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-main);
    }

    /* 目前天氣主視覺卡片 */
    .current-weather-card {
      background: linear-gradient(135deg, #fffaf4 0%, #f9ebd9 100%);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .current-main {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .current-icon {
      font-size: 3.6rem;
      line-height: 1;
    }

    .current-temp {
      font-size: 3rem;
      font-weight: 700;
      line-height: 1.1;
      color: var(--text-main);
    }

    .current-desc {
      font-size: 1.05rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .current-details {
      display: grid;
      grid-template-columns: repeat(2, minmax(110px, 1fr));
      gap: 12px;
      background: rgba(255, 255, 255, 0.72);
      padding: 14px 18px;
      border-radius: 14px;
      border: 1px solid rgba(239, 228, 216, 0.8);
    }

    .detail-item span {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .detail-item strong {
      font-size: 1rem;
      color: var(--text-main);
    }

    /* 生活建議網格 */
    .advice-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .advice-box {
      background-color: var(--card-warm);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .advice-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 700;
      font-size: 0.98rem;
    }

    .advice-tag {
      font-size: 0.78rem;
      padding: 2px 8px;
      border-radius: 10px;
      background: var(--primary-light);
      color: var(--primary);
      font-weight: 700;
    }

    .advice-text {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    /* 7天預報列表 */
    .forecast-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .forecast-row {
      display: grid;
      grid-template-columns: 1.3fr 1.1fr 1fr 1.2fr;
      align-items: center;
      padding: 12px 14px;
      background-color: #fcf9f5;
      border-radius: 12px;
      border: 1px solid #f2e8dc;
      font-size: 0.95rem;
    }

    .forecast-row.today {
      background-color: var(--card-warm);
      border-color: #e6cbb0;
      font-weight: 500;
    }

    .f-day {
      font-weight: 700;
    }

    .f-date {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-left: 4px;
      font-weight: 400;
    }

    .f-weather {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .f-rain {
      color: #3b7ea1;
      font-size: 0.88rem;
      font-weight: 500;
    }

    .f-temp {
      text-align: right;
      font-weight: 700;
    }

    .f-temp .low {
      color: var(--text-muted);
      font-weight: 400;
    }

    footer {
      text-align: center;
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 28px;
    }

    footer a {
      color: var(--primary);
      text-decoration: none;
    }

    /* 手機版響應式調整 */
    @media (max-width: 640px) {
      h1 {
        font-size: 1.3rem;
      }

      .current-weather-card {
        flex-direction: column;
        align-items: flex-start;
      }

      .current-details {
        width: 100%;
      }

      .advice-grid {
        grid-template-columns: 1fr;
      }

      .forecast-row {
        grid-template-columns: 1.2fr 1fr 0.8fr 1.1fr;
        padding: 10px 10px;
        font-size: 0.88rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 頂部標題與位置按鈕 -->
    <header>
      <div class="location-title-group">
        <span class="location-badge" id="locationTypeBadge">預設城市</span>
        <h1 id="cityName">台北市</h1>
      </div>
      <div class="btn-group">
        <button class="btn-primary" id="locateBtn" onclick="useMyLocation()">
          📍 使用我的位置
        </button>
        <button class="btn-secondary" id="resetTaipeiBtn" onclick="loadTaipei()" style="display: none;">
          回到台北
        </button>
      </div>
    </header>

    <div class="status-msg" id="statusMsg">正在載入最新天氣資料...</div>

    <!-- 目前天氣卡片 -->
    <section class="card current-weather-card" aria-label="目前天氣">
      <div class="current-main">
        <div class="current-icon" id="currentIcon">⛅</div>
        <div>
          <div class="current-temp" id="currentTemp">--°</div>
          <div class="current-desc" id="currentDesc">載入中</div>
        </div>
      </div>
      <div class="current-details">
        <div class="detail-item">
          <span>體感溫度</span>
          <strong id="apparentTemp">--°C</strong>
        </div>
        <div class="detail-item">
          <span>今日高低溫</span>
          <strong id="todayMinMax">--° / --°</strong>
        </div>
        <div class="detail-item">
          <span>今日降雨機率</span>
          <strong id="todayRainProb">--%</strong>
        </div>
        <div class="detail-item">
          <span>目前風速</span>
          <strong id="currentWind">-- km/h</strong>
        </div>
      </div>
    </section>

    <!-- 貼心生活建議 -->
    <section class="card" aria-label="今日生活建議">
      <h2 class="section-title">✨ 今日生活行動建議</h2>
      <div class="advice-grid">
        <div class="advice-box">
          <div class="advice-header">
            <span>🌂 帶傘提醒</span>
            <span class="advice-tag" id="umbrellaTag">評估中</span>
          </div>
          <p class="advice-text" id="umbrellaAdvice">正在分析降雨機率...</p>
        </div>

        <div class="advice-box">
          <div class="advice-header">
            <span>👕 穿搭建議</span>
            <span class="advice-tag" id="outfitTag">評估中</span>
          </div>
          <p class="advice-text" id="outfitAdvice">正在分析氣溫與溫差...</p>
        </div>

        <div class="advice-box">
          <div class="advice-header">
            <span>🏃‍♀️ 跑步指數</span>
            <span class="advice-tag" id="runTag">評估中</span>
          </div>
          <p class="advice-text" id="runAdvice">正在評估戶外慢跑條件...</p>
        </div>

        <div class="advice-box">
          <div class="advice-header">
            <span>🌙 晚上夜遊</span>
            <span class="advice-tag" id="nightTag">評估中</span>
          </div>
          <p class="advice-text" id="nightAdvice">正在評估夜間氣溫與天氣...</p>
        </div>
      </div>
    </section>

    <!-- 未來 7 天預報 -->
    <section class="card" aria-label="未來7天預報">
      <h2 class="section-title">📅 今天與未來 7 天預報</h2>
      <div class="forecast-list" id="forecastList">
        <!-- 由 JavaScript 動態產生 -->
      </div>
    </section>

    <footer>
      氣象資料來源：<a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> ｜ 
      <a href="index.html">返回個人首頁</a>
    </footer>
  </div>

  <script>
    // 台北預設座標
    const TAIPEI_COORDS = {
      lat: 25.0330,
      lon: 121.5654,
      name: '台北市',
      badge: '預設城市'
    };

    // WMO 天氣代碼轉換表
    function parseWeatherCode(code) {
      if (code === 0) return { text: '晴朗無雲', icon: '☀️', isRainy: false };
      if (code === 1) return { text: '大致晴朗', icon: '🌤️', isRainy: false };
      if (code === 2) return { text: '多雲時晴', icon: '⛅', isRainy: false };
      if (code === 3) return { text: '陰天多雲', icon: '☁️', isRainy: false };
      if (code === 45 || code === 48) return { text: '有霧', icon: '🌫️', isRainy: false };
      if ([51, 53, 55, 56, 57].includes(code)) return { text: '毛毛雨', icon: '🌦️', isRainy: true };
      if ([61, 63, 65, 66, 67].includes(code)) return { text: '有雨', icon: '🌧️', isRainy: true };
      if ([71, 73, 75, 77].includes(code)) return { text: '降雪', icon: '❄️', isRainy: true };
      if ([80, 81, 82].includes(code)) return { text: '陣雨', icon: '🌦️', isRainy: true };
      if ([85, 86].includes(code)) return { text: '陣雪', icon: '🌨️', isRainy: true };
      if ([95, 96, 99].includes(code)) return { text: '雷陣雨', icon: '⛈️', isRainy: true };
      return { text: '多雲', icon: '⛅', isRainy: false };
    }

    // 載入台北天氣
    function loadTaipei() {
      document.getElementById('resetTaipeiBtn').style.display = 'none';
      fetchWeather(TAIPEI_COORDS.lat, TAIPEI_COORDS.lon, TAIPEI_COORDS.name, TAIPEI_COORDS.badge);
    }

    // 取得使用者目前位置
    function useMyLocation() {
      const statusEl = document.getElementById('statusMsg');
      const locateBtn = document.getElementById('locateBtn');

      if (!navigator.geolocation) {
        statusEl.textContent = '⚠️ 你的瀏覽器不支援定位功能，目前維持顯示台北天氣。';
        return;
      }

      locateBtn.disabled = true;
      statusEl.textContent = '📍 正在取得你的定位權限與位置...';

      navigator.geolocation.getCurrentPosition(
        async (position) => {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;
          statusEl.textContent = '🔍 已取得位置，正在查詢地名與最新氣象...';

          // 嘗試透過 OpenStreetMap Nominatim 取得所在城市/行政區名稱
          let placeName = '我的所在地';
          try {
            const geoRes = await fetch(
              `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&accept-language=zh-TW`
            );
            if (geoRes.ok) {
              const geoData = await geoRes.json();
              const addr = geoData.address || {};
              const city = addr.city || addr.county || addr.state || '';
              const district = addr.suburb || addr.town || addr.district || '';
              if (city || district) {
                placeName = `${city}${district}`;
              }
            }
          } catch (e) {
            // 若反向地理編碼失敗，維持顯示「我的所在地」
          }

          document.getElementById('resetTaipeiBtn').style.display = 'inline-flex';
          await fetchWeather(lat, lon, placeName, '目前位置');
          locateBtn.disabled = false;
        },
        (error) => {
          locateBtn.disabled = false;
          if (error.code === error.PERMISSION_DENIED) {
            statusEl.textContent = '⚠️ 你拒絕了位置權限，若需查看所在地天氣請允許瀏覽器存取位置。';
          } else {
            statusEl.textContent = '⚠️ 無法取得目前位置，請稍後再試。';
          }
        },
        { timeout: 10000 }
      );
    }

    // 呼叫 Open-Meteo API 取得天氣資料 (今天 + 未來7天 = 8天)
    async function fetchWeather(lat, lon, displayName, badgeText) {
      const statusEl = document.getElementById('statusMsg');
      statusEl.textContent = `正在更新「${displayName}」的天氣資料...`;

      const apiUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=8`;

      try {
        const response = await fetch(apiUrl);
        if (!response.ok) throw new Error('API 回應異常');
        const data = await response.json();

        document.getElementById('cityName').textContent = displayName;
        document.getElementById('locationTypeBadge').textContent = badgeText;

        renderCurrentWeather(data);
        renderLifeAdvice(data);
        renderForecast(data);

        const nowTime = new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
        statusEl.textContent = `✅ 資料已更新（更新時間：${nowTime}）`;
      } catch (err) {
        statusEl.textContent = '❌ 天氣資料載入失敗，請檢查網路連線後重新整理。';
      }
    }

    // 渲染目前天氣
    function renderCurrentWeather(data) {
      const current = data.current;
      const daily = data.daily;
      const weatherInfo = parseWeatherCode(current.weather_code);

      document.getElementById('currentIcon').textContent = weatherInfo.icon;
      document.getElementById('currentTemp').textContent = `${Math.round(current.temperature_2m)}°`;
      document.getElementById('currentDesc').textContent = weatherInfo.text;
      document.getElementById('apparentTemp').textContent = `${Math.round(current.apparent_temperature)}°C`;
      document.getElementById('todayMinMax').textContent = `${Math.round(daily.temperature_2m_min[0])}° / ${Math.round(daily.temperature_2m_max[0])}°`;
      
      const rainProb = daily.precipitation_probability_max[0] ?? 0;
      document.getElementById('todayRainProb').textContent = `${rainProb}%`;
      document.getElementById('currentWind').textContent = `${Math.round(current.wind_speed_10m)} km/h`;
    }

    // 產生並渲染生活建議
    function renderLifeAdvice(data) {
      const current = data.current;
      const daily = data.daily;

      const curTemp = current.temperature_2m;
      const windSpeed = current.wind_speed_10m;
      const weatherInfo = parseWeatherCode(current.weather_code);
      const maxTemp = daily.temperature_2m_max[0];
      const minTemp = daily.temperature_2m_min[0];
      const rainProb = daily.precipitation_probability_max[0] ?? 0;
      const tempDiff = maxTemp - minTemp;

      // 1. 帶傘提醒
      const umbrellaTag = document.getElementById('umbrellaTag');
      const umbrellaAdvice = document.getElementById('umbrellaAdvice');
      if (weatherInfo.isRainy || rainProb >= 50) {
        umbrellaTag.textContent = '建議帶傘';
        umbrellaAdvice.textContent = `今日降雨機率達 ${rainProb}%，出門請務必隨身攜帶雨具，避免淋濕著涼。`;
      } else if (rainProb >= 30) {
        umbrellaTag.textContent = '備用折傘';
        umbrellaAdvice.textContent = `降雨機率約 ${rainProb}%，天氣有些不穩定，包包裡放把輕便折疊傘會更安心。`;
      } else {
        umbrellaTag.textContent = '免帶雨具';
        umbrellaAdvice.textContent = `今日降雨機率僅 ${rainProb}%，天氣相對穩定，出門不用特別帶傘，享受清爽的一天吧！`;
      }

      // 2. 穿搭建議
      const outfitTag = document.getElementById('outfitTag');
      const outfitAdvice = document.getElementById('outfitAdvice');
      let outfitText = '';
      if (maxTemp >= 28) {
        outfitTag.textContent = '透氣短袖';
        outfitText = `白天高溫約 ${Math.round(maxTemp)}°C，建議穿著短袖、棉麻等透氣排汗衣物，注意防曬與補充水分。`;
      } else if (maxTemp >= 22) {
        outfitTag.textContent = '薄長袖/短袖';
        outfitText = `氣溫約 ${Math.round(minTemp)}°~${Math.round(maxTemp)}°C，白天舒適宜人，可穿短袖或薄長袖搭配薄外套。`;
      } else if (maxTemp >= 16) {
        outfitTag.textContent = '洋蔥式穿搭';
        outfitText = `天氣偏涼（低溫 ${Math.round(minTemp)}°C），建議長袖上衣搭配針織衫或防風外套，方便隨時穿脫。`;
      } else {
        outfitTag.textContent = '保暖厚外套';
        outfitText = `氣溫較冷（低溫僅 ${Math.round(minTemp)}°C），建議穿著發熱衣、毛衣搭配保暖大衣或羽絨外套。`;
      }
      if (tempDiff >= 7) {
        outfitText += `（今日日夜溫差達 ${Math.round(tempDiff)}°C，早晚記得多加一件外套！）`;
      }
      outfitAdvice.textContent = outfitText;

      // 3. 跑步指數
      const runTag = document.getElementById('runTag');
      const runAdvice = document.getElementById('runAdvice');
      if (weatherInfo.isRainy || rainProb >= 50) {
        runTag.textContent = '建議室內';
        runAdvice.textContent = `降雨機率高且路面容易濕滑，今天不太適合戶外路跑，建議改做室內核心或跑步機訓練。`;
      } else if (curTemp > 30) {
        runTag.textContent = '注意防暑';
        runAdvice.textContent = `目前氣溫較高（${Math.round(curTemp)}°C），戶外跑步容易中暑脫水，建議改到傍晚太陽下山後再跑。`;
      } else if (curTemp >= 14 && curTemp <= 25 && windSpeed < 25) {
        runTag.textContent = '非常適合';
        runAdvice.textContent = `目前 ${Math.round(curTemp)}°C 且風速適中，是非常舒服的跑步天氣！記得跑前暖身、跑後伸展。`;
      } else {
        runTag.textContent = '可以慢跑';
        runAdvice.textContent = `目前氣溫 ${Math.round(curTemp)}°C，戶外可以跑步，但建議注意風勢與保暖，做好熱身再出發。`;
      }

      // 4. 晚上夜遊建議
      const nightTag = document.getElementById('nightTag');
      const nightAdvice = document.getElementById('nightAdvice');
      if (weatherInfo.isRainy || rainProb >= 50) {
        nightTag.textContent = '改約室內';
        nightAdvice.textContent = `晚上有下雨機率且視線較差，不太適合戶外夜遊，建議改去室內咖啡廳、書店或逛街。`;
      } else if (minTemp < 15) {
        nightTag.textContent = '偏冷注意保暖';
        nightAdvice.textContent = `晚上沒有下雨，適合散步或看夜景，但夜間低溫下探 ${Math.round(minTemp)}°C，務必穿暖並注意防風。`;
      } else {
        nightTag.textContent = '適合夜遊';
        nightAdvice.textContent = `夜間天氣穩定不悶熱（低溫約 ${Math.round(minTemp)}°C），非常適合晚上出去散步、吃宵夜或吹風夜遊！`;
      }
    }

    // 渲染今天與未來 7 天預報
    function renderForecast(data) {
      const daily = data.daily;
      const listEl = document.getElementById('forecastList');
      listEl.innerHTML = '';

      const weekDays = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];

      for (let i = 0; i < daily.time.length; i++) {
        const dateStr = daily.time[i];
        const dateObj = new Date(dateStr + 'T00:00:00');
        const month = dateObj.getMonth() + 1;
        const day = dateObj.getDate();
        const dayName = i === 0 ? '今天' : (i === 1 ? '明天' : weekDays[dateObj.getDay()]);

        const wInfo = parseWeatherCode(daily.weather_code[i]);
        const maxT = Math.round(daily.temperature_2m_max[i]);
        const minT = Math.round(daily.temperature_2m_min[i]);
        const rainP = daily.precipitation_probability_max[i] ?? 0;
        const willRainText = rainP >= 30 ? `💧 ${rainP}%` : `☀️ ${rainP}%`;

        const row = document.createElement('div');
        row.className = `forecast-row ${i === 0 ? 'today' : ''}`;
        row.innerHTML = `
          <div class="f-day">${dayName}<span class="f-date">${month}/${day}</span></div>
          <div class="f-weather"><span>${wInfo.icon}</span><span>${wInfo.text}</span></div>
          <div class="f-rain">${willRainText}</div>
          <div class="f-temp"><span class="low">${minT}°</span> / ${maxT}°</div>
        `;
        listEl.appendChild(row);
      }
    }

    // 網頁開啟時預設載入台北天氣
    window.addEventListener('DOMContentLoaded', loadTaipei);
  </script>
</body>
